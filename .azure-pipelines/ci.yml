trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"

  - script: npm ci
    displayName: Install dependencies

  - script: npm run typecheck
    displayName: Typecheck

  - script: npm run test
    displayName: Run Vitest suites

  - script: npm run test:bdd
    displayName: Run BDD suites

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: ".artifacts/reports/**/*.xml"
      failTaskOnFailedTests: true

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: ".artifacts"
      ArtifactName: "automation-artifacts"
